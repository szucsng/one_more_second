name: Deploy Web Build

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]
    paths:
      - "**.gd"
      - "**.tscn"
      - "**.tres"
      - "**.godot"
      - "**.html"
      - "**/assets/**"
      - "web/**"
      - "export_presets.cfg"
      - ".github/workflows/deploy-web.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot
        run: |
          curl -L -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip -d godot-bin
          chmod +x "godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          echo "GODOT_BIN=$PWD/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"

      - name: Cache export templates
        id: templates-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-export-templates-${{ env.GODOT_VERSION }}-stable-v1

      - name: Install export templates
        if: steps.templates-cache.outputs.cache-hit != 'true'
        run: |
          curl -L -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q templates.tpz -d templates-extract
          cp -R templates-extract/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Import project
        run: '"$GODOT_BIN" --headless --path . --import'

      - name: Export web
        run: |
          mkdir -p exports/web
          "$GODOT_BIN" --headless --path . --export-release "Web" "$PWD/exports/web/index.html"
          cp web/ads-config.js exports/web/ads-config.js
          cp web/ads-bridge.js exports/web/ads-bridge.js
          mkdir -p exports/web/fonts
          cp web/fonts/rajdhani-bold.woff2 exports/web/fonts/rajdhani-bold.woff2
          touch exports/web/.nojekyll

      - name: Package itch.io ZIP
        run: |
          cd exports/web
          zip -q -r ../one-more-second-web.zip .

      - name: Upload itch.io package
        uses: actions/upload-artifact@v4
        with:
          name: one-more-second-web
          path: exports/one-more-second-web.zip
          if-no-files-found: error

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: exports/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
